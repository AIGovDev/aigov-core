name: python-aigov

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "python/**"
      - "scripts/**"
      - ".github/workflows/python-aigov.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-smoke:
    name: python-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package
        working-directory: python
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -e ".[dev]"

      - name: Python smoke tests
        working-directory: python
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m pytest tests/test_standards_conformance.py tests/test_mcp_preexecution_authorization.py tests/test_huggingface_provenance.py tests/test_huggingface_evaluation.py tests/test_huggingface_transformers.py tests/test_huggingface_evaluate.py -q
          ruff check ../mcp/aigov_mcp_server.py ../examples/mcp-trusted-execution/approve_template_request.py tests/test_mcp_preexecution_authorization.py
          ruff format --check ../examples/mcp-trusted-execution/approve_template_request.py tests/test_mcp_preexecution_authorization.py

      - name: Write Python smoke summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# AIGov Python smoke"
            echo
            echo "Status: ${{ job.status }}"
            echo "Full Python pytest runs in nightly-full-validation and release-validation."
          } >> "${GITHUB_STEP_SUMMARY}"
