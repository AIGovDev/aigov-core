name: CLA v2 — Security

on:
  pull_request:
    paths:
      - .github/workflows/cla*.yml
      - scripts/check_cla_workflow_security.py
  push:
    branches: [staging, main]
    paths:
      - .github/workflows/cla*.yml
      - scripts/check_cla_workflow_security.py

permissions:
  contents: read

jobs:
  cla-security-guard:
    name: CLA workflow security guard (not a required status)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check privileged CLA workflow invariants
        run: python3 scripts/check_cla_workflow_security.py
