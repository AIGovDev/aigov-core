name: supply-chain-audit

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  dependabot-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # The Dependabot validator imports only PyYAML beyond the stdlib.
      # Avoid installing the full Python SDK and dev dependency tree.
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Validate Dependabot targets staging
        run: |
          set -euo pipefail
          make dependabot-config-check

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install cargo-audit
        run: |
          set -euo pipefail
          export CARGO_HTTP_MULTIPLEXING=false
          for attempt in 1 2 3; do
            cargo install cargo-audit --locked && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done
          cargo audit --version

      - name: cargo audit
        working-directory: rust
        run: cargo audit

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        working-directory: python
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ".[dev]"

      - name: pip-audit
        working-directory: python
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m pip install pip-audit
          python -m pip_audit
