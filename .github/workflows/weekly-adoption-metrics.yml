name: Weekly open-source adoption metrics

on:
  schedule:
    - cron: "15 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Collect public counters and package downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/adoption"
          python3 scripts/oss_metrics_snapshot.py \
            --repo AIGovDev/aigov-core \
            --pypi-package aigov-py \
            --output "${RUNNER_TEMP}/adoption/snapshot.json"

      - name: Write status summary
        run: |
          python3 - "${RUNNER_TEMP}/adoption/snapshot.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          metrics = data["metrics"]
          print("# Weekly open-source adoption metrics")
          print()
          print(f"Collected: {data['collected_at']} · Repository: {data['repository']}")
          print()
          print("| Metric | Value | Status |")
          print("|---|---:|---|")
          for name in (
              "stars",
              "forks",
              "contributors_unique_accounts",
              "pypi_downloads",
              "release_asset_downloads",
              "traffic_views_14d",
              "traffic_clones_14d",
          ):
              item = metrics[name]
              value = item.get("value", "—")
              print(f"| {name} | {value} | {item['status']} |")
          print()
          print("Counters and rolling downloads are not unique people or verified deployments. Missing traffic remains unavailable.")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adoption-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/adoption/snapshot.json
          if-no-files-found: error
          retention-days: 90
