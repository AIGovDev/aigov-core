# AIGov Core OSS developer experience: scripts that exist in this repository only.
# Platform-wide validators (commercial, hosted, regulatory, and similar) live in the proprietary platform repository.

name: oss-developer-experience

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oss-developer-experience-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python package
        working-directory: python
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -e ".[dev]"

      # enterprise-readiness-check already runs cursor-plugin-check and
      # public-sdk-packages-check. Do not run these expensive checks twice.
      - name: Core readiness (gate + SDK + Cursor + runtime contracts + benchmark)
        run: |
          set -euo pipefail
          make enterprise-readiness-check

      - name: Export public SDK check JSON
        run: |
          set -euo pipefail
          mkdir -p .oss-ci-out
          python3 scripts/public_sdk_packages_check.py --json > .oss-ci-out/public-sdk-packages.json

      - name: Upload OSS check JSON artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oss-check-json
          path: .oss-ci-out/
