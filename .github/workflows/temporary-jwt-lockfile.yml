name: temporary JWT downstream Cargo resolver
on:
  push:
    branches:
      - dependabot/cargo/rust/staging/jsonwebtoken-12.0.0
    paths:
      - .github/workflows/temporary-jwt-lockfile.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: tests/downstream-consumption/rust-consumer
          - dir: examples/minimal-project
          - dir: rust/adapters/immutable_s3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.dir }}"
          cargo update
          echo CARGO_LOCK_BEGIN
          base64 -w512 Cargo.lock | sed 's/^/LOCKDATA:/'
          echo CARGO_LOCK_END
