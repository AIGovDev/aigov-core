name: Core HTTP benchmark
on:
  pull_request:
    branches: [staging]
    paths:
      - 'scripts/benchmark_core_http.py'
      - 'rust/src/transactional_ledger.rs'
      - 'rust/tests/transactional_ledger.rs'
      - 'rust/migrations/**'
      - '.github/workflows/core-http-benchmark.yml'
      - 'scripts/verify_benchmark_ledger.py'
      - 'scripts/test_verify_benchmark_ledger.py'
      - 'scripts/verify_offline_checkpoint.py'
      - 'scripts/test_verify_offline_checkpoint.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: govai
          POSTGRES_USER: aigov_test
          POSTGRES_PASSWORD: aigov_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigov_test -d govai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - run: python -m pip install -e ./python
      - run: python -m unittest discover -s scripts -p 'test_verify_*ledger.py'
      - run: python -m unittest discover -s scripts -p test_verify_offline_checkpoint.py
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked --bin aigov_audit
      - name: Test transactional ledger against PostgreSQL
        env:
          GOVAI_DATABASE_URL: postgresql://aigov_test:aigov_ci_only@127.0.0.1:5432/govai
        run: cargo test --manifest-path rust/Cargo.toml --release --locked --test transactional_ledger -- --ignored
      - name: Benchmark disposable release Core
        env:
          AIGOV_ENVIRONMENT: dev
          AIGOV_BIND: 127.0.0.1:18089
          GOVAI_DATABASE_URL: postgresql://aigov_test:aigov_ci_only@127.0.0.1:5432/govai
          GOVAI_API_USAGE_STORE: memory
          GOVAI_AUTO_MIGRATE: "true"
          GOVAI_API_KEY: test-key-tenant-a-0001
          GOVAI_API_KEYS: test-key-tenant-a-0001
          GOVAI_API_KEYS_JSON: '{"test-key-tenant-a-0001":"tenant-a"}'
          AIGOV_BENCHMARK_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export GOVAI_LEDGER_DIR="$RUNNER_TEMP/ledger"
          export AIGOV_POLICY_DIR="$GITHUB_WORKSPACE/rust"
          export AIGOV_POLICY_FILE="$GITHUB_WORKSPACE/rust/policy.dev.json"
          mkdir -p "$GOVAI_LEDGER_DIR"
          rust/target/release/aigov_audit > "$RUNNER_TEMP/core.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            kill -0 "$pid"
            if curl --fail --silent http://127.0.0.1:18089/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18089/health >/dev/null
          python scripts/benchmark_core_http.py --url http://127.0.0.1:18089 --events 100 --workers 4 --disposable --out "$RUNNER_TEMP/http-benchmark.json"
          kill "$pid"
          wait "$pid" || true
          python scripts/verify_benchmark_ledger.py --ledger "$GOVAI_LEDGER_DIR/audit_log__tenant-a.jsonl" --result "$RUNNER_TEMP/http-benchmark.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-http-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/http-benchmark.json
          if-no-files-found: error
