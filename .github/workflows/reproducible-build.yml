name: Reproducible Rust build
on:
  pull_request:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - name: Build twice and compare
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export CARGO_INCREMENTAL=0
          mkdir -p "$RUNNER_TEMP/repro-evidence"
          rustc -vV > "$RUNNER_TEMP/repro-evidence/toolchain.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/repro-evidence/revision.txt"
          for label in a b; do
            root="$RUNNER_TEMP/repro-$label"
            mkdir -p "$root"
            git archive HEAD rust | tar -x -C "$root"
            (
              cd "$root/rust"
              export CARGO_TARGET_DIR="$root/target"
              export RUSTFLAGS="--remap-path-prefix=$root=/build --remap-path-prefix=$HOME/.cargo=/cargo"
              cargo build --locked --release --bin aigov_audit
              cp "$CARGO_TARGET_DIR/release/aigov_audit" "$RUNNER_TEMP/repro-evidence/$label.bin"
            )
          done
          cd "$RUNNER_TEMP/repro-evidence"
          sha256sum a.bin b.bin > sha256.txt
          cmp a.bin b.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reproducible-build-evidence
          path: ${{ runner.temp }}/repro-evidence/
          if-no-files-found: error
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - name: Clean independent build
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export CARGO_INCREMENTAL=0
          root="$RUNNER_TEMP/independent-${{ matrix.replica }}"
          mkdir -p "$root" "$RUNNER_TEMP/independent-evidence"
          git archive HEAD rust | tar -x -C "$root"
          cd "$root/rust"
          export CARGO_TARGET_DIR="$root/target"
          export RUSTFLAGS="--remap-path-prefix=$root=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --locked --release --bin aigov_audit
          cd "$RUNNER_TEMP/independent-evidence"
          cp "$CARGO_TARGET_DIR/release/aigov_audit" binary
          sha256sum binary > sha256.txt
          rustc -vV > toolchain.txt
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-build-${{ matrix.replica }}
          path: ${{ runner.temp }}/independent-evidence/
          if-no-files-found: error
  compare-independent:
    needs: independent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: independent-build-*
          path: evidence
      - name: Verify identical revision, toolchain and binary
        run: |
          set -euo pipefail
          cd evidence
          for label in a b; do
            (cd "independent-build-$label" && sha256sum -c sha256.txt)
          done
          for file in revision.txt toolchain.txt binary; do
            cmp "independent-build-a/$file" "independent-build-b/$file"
          done
