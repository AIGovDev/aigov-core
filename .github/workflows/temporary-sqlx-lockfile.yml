name: temporary downstream Rust lockfile resolver
on:
  push:
    branches:
      - dependabot/cargo/rust/staging/sqlx-0.9.1
    paths:
      - .github/workflows/temporary-sqlx-lockfile.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: downstream
            dir: tests/downstream-consumption/rust-consumer
          - project: example
            dir: examples/minimal-project
          - project: s3
            dir: rust/adapters/immutable_s3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve consumer lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.dir }}"
          cargo update
          echo CARGO_LOCK_BEGIN
          base64 -w512 Cargo.lock | sed 's/^/LOCKDATA:/'
          echo CARGO_LOCK_END
