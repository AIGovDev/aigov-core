name: Hugging Face live validation
on:
  pull_request:
    branches: [staging]
    paths:
      - 'examples/integrations/huggingface/**'
      - 'python/aigov_py/huggingface_*.py'
      - '.github/workflows/huggingface-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./python -r examples/integrations/huggingface/requirements-demo.txt
          python -m pip check
          python -m pip freeze
      - name: Run real Hub evaluation and tampering check
        run: |
          set -euo pipefail
          REVISION=$(python -c 'from huggingface_hub import HfApi; print(HfApi().model_info("hf-internal-testing/tiny-random-bert", token=False).sha)')
          echo "Model revision: $REVISION"
          python examples/integrations/huggingface/evaluation_demo.py --revision "$REVISION"
