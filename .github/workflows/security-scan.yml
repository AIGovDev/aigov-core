name: security-scan

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks (secret scanning)
        run: |
          "${RUNNER_TEMP}/bin/gitleaks" git --redact --verbose .

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: trivy fs (dependency + vuln scanning)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
