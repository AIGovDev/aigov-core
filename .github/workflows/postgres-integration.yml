name: PostgreSQL Integration

on:
  push:
    branches: [feat/agent-tool-hardening, main, develop, staging]
    paths:
      - 'benchmarks/agent-verification/**'
      - 'benchmarks/openai-agents-integration/**'
      - 'python/tests/test_postgres_integration.py'
      - 'python/tests/test_distributed_safety.py'
      - '.github/workflows/postgres-integration.yml'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'benchmarks/agent-verification/**'
      - 'benchmarks/openai-agents-integration/**'
      - 'python/tests/test_postgres_integration.py'
      - 'python/tests/test_distributed_safety.py'

jobs:
  postgres-integration:
    name: PostgreSQL-backed authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aigov_test
          POSTGRES_PASSWORD: aigov_test_pass
          POSTGRES_DB: aigov_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigov_test -d aigov_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aigov_test:aigov_test_pass@localhost:5432/aigov_integration
      TEST_PG_DSN: postgresql://aigov_test:aigov_test_pass@localhost:5432/aigov_integration
      # Ephemeral service container dedicated to tests; destructive DROP TABLE is permitted only here.
      AIGOV_PG_TEST_DESTRUCTIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install psycopg3 binary
        run: pip install 'psycopg[binary]>=3.3.9' pytest pytest-timeout

      - name: Verify PostgreSQL is reachable
        run: |
          pg_isready -h localhost -p 5432 -U aigov_test -d aigov_integration
          python -c "import psycopg; conn = psycopg.connect('$DATABASE_URL'); print('PostgreSQL', conn.execute('SELECT version()').fetchone()[0][:20]); conn.close()"

      - name: Run PostgreSQL integration tests
        # DATABASE_URL is set above; tests are NOT skipped
        # If this step passes with 0 failures, the distributed safety claim is validated
        run: |
          cd python
          python -m pytest \
            tests/test_postgres_integration.py \
            -v \
            --timeout=120 \
            --tb=short \
            -x

      - name: Run distributed safety tests (SQLite backends)
        run: |
          cd python
          python -m pytest \
            tests/test_distributed_safety.py \
            -v \
            --timeout=120 \
            --tb=short

      - name: Run agent integration tests
        run: |
          cd python
          python -m pytest \
            tests/test_agent_integration.py \
            -v \
            --timeout=120 \
            --tb=short

      - name: Run SDK production tests (P15, P18-P32)
        # TEST_PG_DSN is set above. In CI, PG tests FAIL (not skip) if TEST_PG_DSN is absent.
        # Requires openai-agents and cryptography packages.
        run: |
          pip install 'openai-agents>=0.25.0' cryptography
          cd benchmarks/openai-agents-integration
          python -m pytest \
            tests/test_sdk_production.py \
            -v \
            --timeout=120 \
            --tb=short \
            -x

      - name: Verify no DB tests are silently skipped
        # This step catches the case where DATABASE_URL is unset and tests would pass by skipping.
        # It fails if any postgres test was collected but skipped.
        run: |
          cd python
          SKIP_COUNT=$(python -m pytest tests/test_postgres_integration.py --collect-only -q 2>/dev/null | grep "skip" | wc -l || echo 0)
          echo "Skipped: $SKIP_COUNT"
          if [ "$SKIP_COUNT" -gt "0" ]; then
            echo "ERROR: PostgreSQL tests were skipped. DATABASE_URL may not be set." >&2
            exit 1
          fi
          echo "All PostgreSQL tests ran (none silently skipped)."

      - name: Verify no SDK PG tests are silently skipped
        run: |
          cd benchmarks/openai-agents-integration
          SKIP_COUNT=$(python -m pytest tests/test_sdk_production.py --collect-only -q 2>/dev/null | grep "skip" | wc -l || echo 0)
          echo "SDK PG tests skipped: $SKIP_COUNT"
          if [ "$SKIP_COUNT" -gt "0" ]; then
            echo "ERROR: SDK PostgreSQL tests were skipped. TEST_PG_DSN may not be set." >&2
            exit 1
          fi
          echo "All SDK PostgreSQL tests ran (none silently skipped)."

  security-lint:
    name: Security and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install bandit mypy 'psycopg[binary]>=3.3.9'

      - name: Bandit security scan on agent-verification
        run: |
          bandit -r benchmarks/agent-verification/ \
            --skip B101,B311 \
            --severity-level medium \
            --confidence-level medium \
            -f txt || true

      - name: Check for hardcoded secrets (no broad allowlists)
        # Checks for patterns that look like real credentials.
        # Test credential constants (aigov_test_pass, etc.) are in test files only.
        run: |
          if grep -rn --include="*.py" -E "password\s*=\s*['\"][^'\"]{8,}" \
              benchmarks/agent-verification/ ; then
            echo "WARNING: possible hardcoded password in benchmarks/agent-verification/"
          fi
          echo "Secret scan complete."

      - name: Verify no production credentials in source
        run: |
          # Confirm that test credentials exist ONLY in test files, not in source modules
          if grep -rn "aigov_test_pass" benchmarks/agent-verification/*.py 2>/dev/null; then
            echo "ERROR: test credential found in production source file." >&2
            exit 1
          fi
          echo "No test credentials in production source files."
