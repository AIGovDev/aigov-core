[project]
name = "aigov-py"
version = "0.2.1"
description = "AIGov Python package: audit HTTP client, evidence tooling, and agent verification reference implementation."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "AIGov Contributors" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "requests>=2.31.0",
  "scikit-learn>=1.7.2",
  "joblib>=1.3.0",
  "PyYAML>=6.0.0",
  "PyNaCl>=1.6.2",
  "sigstore>=4.2.0"
]

[project.urls]
Homepage = "https://github.com/MonikaDvorackova/aigov-core"
Repository = "https://github.com/MonikaDvorackova/aigov-core"
Documentation = "https://github.com/MonikaDvorackova/aigov-core/tree/main/docs"
Changelog = "https://github.com/MonikaDvorackova/aigov-core/blob/main/CHANGELOG.md"

[project.scripts]
aigov = "aigov_py.cli:main"
govai = "aigov_py.cli:main"  # backward-compatible alias; prefer `aigov`

[project.optional-dependencies]
server = [
  "fastapi>=0.162.5",
  "uvicorn>=0.54.0"
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.17.5",
  "mypy>=1.8.0",
  "types-requests>=2.33.0.20261030",
  "PyYAML>=6.0.0",
]
runs-postgres = [
  "psycopg[binary]>=3.3.9",
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
aigov_py = [
  "experiments/datasets/*.json",
  "experiments/scripts/*.py",
  "experiments/scenario_rubric.json",
  "experiments/artifact_bundle_replay_rubric.json",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aigov_py*", "govai*"]
exclude = ["artifacts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
